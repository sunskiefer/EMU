name: Delete all EMU releases (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for k in 303mpc shmpc 808mpc 909mpc qvrbgtmpc; do
            for v in 0.1.0 0.2.0; do
              gh release delete "$k-v$v" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            done
          done
          gh release list --repo "$GITHUB_REPOSITORY"
