name: Release all plugins (0.1.0, pre-release)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the five pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make() {
            if gh release view "$1" >/dev/null 2>&1; then echo "$1 already exists, skipped"; return; fi
            gh release create "$1" "$2" --target "${GITHUB_SHA}" --prerelease --title "$3" --notes-file "$4"
          }
          make 303mpc-v0.1.0 builds/303MPC-0.1.0-mpc-armv7.zip '303MPC 0.1.0' release-notes/303mpc.md
          make shmpc-v0.1.0 builds/SHMPC-0.1.0-mpc-armv7.zip 'SHMPC 0.1.0' release-notes/shmpc.md
          make 808mpc-v0.1.0 builds/808MPC-0.1.0-mpc-armv7.zip '808MPC 0.1.0' release-notes/808mpc.md
          make 909mpc-v0.1.0 builds/909MPC-0.1.0-mpc-armv7.zip '909MPC 0.1.0' release-notes/909mpc.md
          make qvrbgtmpc-v0.1.0 builds/QVRBGT-MPC-0.1.0-mpc-armv7.zip 'QVRBGT MPC 0.1.0' release-notes/qvrbgtmpc.md
